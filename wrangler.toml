name = "michael-ai"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# mnorthrup.com is registered in this account, so these attach the domain
# and set up DNS + TLS automatically on deploy.
routes = [
  { pattern = "mnorthrup.com", custom_domain = true },
  { pattern = "www.mnorthrup.com", custom_domain = true },
]

# Static résumé page. The Worker handles /api/* and the www redirect;
# everything else is served from ./public.
# Workers Logs: request logs plus the anonymous question log from src/chat.ts.
[observability]
enabled = true

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker before serving files, so the www -> apex redirect applies to pages too.
run_worker_first = true

[vars]
CHAT_MODEL = "claude-opus-5-5"
# Hard cap on chat messages per UTC day across all visitors.
DAILY_MESSAGE_LIMIT = "200"

# Per-IP chat limit, enforced by Cloudflare across all isolates.
# namespace_id is any account-unique integer string.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "2001"
simple = { limit = 6, period = 60 }

# Secret (not committed): ANTHROPIC_API_KEY
#   local:  .dev.vars
#   remote: pnpm wrangler secret put ANTHROPIC_API_KEY

# Global daily message counter (exact across all isolates).
[[durable_objects.bindings]]
name = "BUDGET"
class_name = "DailyBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DailyBudget"]
