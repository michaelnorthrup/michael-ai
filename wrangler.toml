name = "michael-ai"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

# Custom domain: uncomment once the domain is in this Cloudflare account.
# Wrangler attaches it and sets up DNS + TLS on deploy.
# routes = [
#   { pattern = "example.com", custom_domain = true },
#   { pattern = "www.example.com", custom_domain = true },
# ]

# Static résumé page. The Worker only handles /api/*; everything else is
# served straight from ./public.
[assets]
directory = "./public"
binding = "ASSETS"

[vars]
CHAT_MODEL = "claude-opus-5-5"
# Workload Identity Federation (see README). The Worker is its own issuer;
# these must match the issuer and rule in the Claude Console.
WIF_ISSUER = "https://michael-ai.workers"
WIF_SUBJECT = "michael-ai-worker"
WIF_AUDIENCE = "https://api.anthropic.com"
ANTHROPIC_ORGANIZATION_ID = ""      # Console: Settings > Organization
ANTHROPIC_FEDERATION_RULE_ID = ""   # fdrl_...
ANTHROPIC_WORKSPACE_ID = ""         # wrkspc_... (optional if the rule has one workspace)

# Per-IP chat limit, enforced by Cloudflare across all isolates.
# namespace_id is any account-unique integer string.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "2001"
simple = { limit = 10, period = 60 }

# Secret (not committed): WIF_SIGNING_KEY, the private JWK from `pnpm wif:keygen`
#   remote: pnpm wif:upload
#   local:  .dev.vars (WIF_SIGNING_KEY=<json>, or ANTHROPIC_API_KEY=... as a fallback)
